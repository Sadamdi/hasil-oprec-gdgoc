<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4285f4">
<title>Pengumuman Open Recruitment GDGoC Maliki</title>
<style>
  :root {
    --bg: #f3f6fc; --card: #ffffff; --ink: #1f2430; --mute: #5f6877; --line: #e4e8f0; --soft: #eef3fe;
    --blue: #4285f4; --red: #ea4335; --yellow: #fbbc04; --green: #34a853;
    --ok1: #1e8e3e; --ok2: #34a853; --no1: #c5392b; --no2: #e0584a;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 10px 30px rgba(20,30,60,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c25; --ink: #eceff5; --mute: #9aa3b5; --line: #272d3a; --soft: #1b2438; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { height: 5px; background: linear-gradient(90deg, var(--blue) 0 25%, var(--red) 25% 50%, var(--yellow) 50% 75%, var(--green) 75%); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 16px 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--mute); font-size: 14px; letter-spacing: .02em; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  h1 { font-size: clamp(25px, 6vw, 36px); line-height: 1.15; margin: 14px 0 6px; letter-spacing: -.02em; }
  .lead { color: var(--mute); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--mute); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input { width: 100%; padding: 13px 14px; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(66,133,244,.18); }
  button.go { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: var(--blue); border: 0; border-radius: 12px; cursor: pointer; transition: transform .1s, filter .15s; }
  button.go:hover { filter: brightness(1.06); }
  button.go:active { transform: scale(.985); }
  button.go:disabled { background: #9aa3b5; cursor: wait; }
  .hint { font-size: 12.5px; color: var(--mute); margin: 10px 0 0; text-align: center; }
  .msg { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
  .msg.err { background: rgba(234,67,53,.08); border-color: rgba(234,67,53,.3); }
  .msg b { display: block; margin-bottom: 2px; }
  .msg .ic { font-size: 22px; line-height: 1.2; }

  /* ---- layar pengumuman ---- */
  .ann { padding: 0; overflow: hidden; }
  .ann-head { padding: 14px 20px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .bio { padding: 18px 20px 6px; display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; font-size: 15px; }
  .bio dt { color: var(--mute); }
  .bio dd { margin: 0; font-weight: 600; word-break: break-word; }
  .verdict { margin: 16px 20px 20px; padding: 26px 20px; border-radius: 16px; text-align: center; color: #fff; transform-origin: center; animation: pop .55s cubic-bezier(.2,1.2,.3,1) both; }
  .verdict.ok { background: linear-gradient(135deg, var(--ok1), var(--ok2)); }
  .verdict.no { background: linear-gradient(135deg, var(--no1), var(--no2)); }
  .verdict .mark { width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-content: center; font-size: 34px; line-height: 1; }
  .verdict small { display: block; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
  .verdict h2 { margin: 4px 0 8px; font-size: clamp(26px, 7vw, 38px); line-height: 1.1; letter-spacing: -.01em; }
  .verdict p { margin: 4px auto 0; max-width: 520px; font-size: 15.5px; opacity: .97; }
  .place { display: inline-block; margin-top: 12px; padding: 9px 16px; border-radius: 12px; background: rgba(255,255,255,.2); font-weight: 700; font-size: 16px; }
  .tag { display: inline-block; margin-top: 8px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.24); }
  @keyframes pop { from { opacity: 0; transform: scale(.88) translateY(10px); } to { opacity: 1; transform: none; } }

  .summary { display: flex; align-items: center; gap: 22px; padding: 6px 20px 22px; flex-wrap: wrap; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .t { stroke: var(--line); }
  .ring .p { stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c b { font-size: 30px; line-height: 1; letter-spacing: -.02em; }
  .ring .c span { font-size: 11.5px; color: var(--mute); }
  .stats { flex: 1; min-width: 200px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; }
  .stat small { display: block; color: var(--mute); font-size: 12px; }
  .stat b { font-size: 21px; letter-spacing: -.01em; }
  .stat em { font-style: normal; color: var(--mute); font-size: 13px; }
  .stat.wide { grid-column: 1 / -1; }

  details.card { padding: 0; }
  details > summary { list-style: none; cursor: pointer; padding: 16px 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "\25BE"; color: var(--mute); transition: transform .2s; }
  details[open] > summary::after { transform: rotate(180deg); }
  details > summary span { font-weight: 500; font-size: 14px; color: var(--mute); }
  .det { padding: 0 20px 18px; }
  .crit { padding: 11px 0; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 500; }
  .row .v { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
  .row .v small { color: var(--mute); font-weight: 500; }
  .meter { height: 8px; border-radius: 99px; background: var(--line); margin: 8px 0 0; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .why { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--blue); background: var(--soft); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--mute); white-space: pre-line; }
  .note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(251,188,4,.12); border: 1px solid rgba(251,188,4,.4); font-size: 14px; white-space: pre-line; }
  .note b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin-bottom: 2px; }
  .sub { font-size: 13px; color: var(--mute); margin: 0 0 8px; }
  .sec-t { font-size: 14px; font-weight: 700; margin: 16px 0 4px; }
  .foot { text-align: center; color: var(--mute); font-size: 12.5px; margin-top: 26px; }
  .final-note { padding: 0 20px 20px; font-size: 13.5px; color: var(--mute); text-align: center; }

  .sk { height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--line) 25%, var(--soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; margin: 10px 0; }
  @keyframes sh { to { background-position: -200% 0; } }
  .fade { animation: up .4s ease both; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  @media (max-width: 420px) { .bio { grid-template-columns: 96px 1fr; font-size: 14px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar"></div>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="brand"><span class="dots"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc04"></i><i style="background:#34a853"></i></span>GDGoC UIN Maulana Malik Ibrahim Malang</div>
  <h1>Pengumuman hasil seleksi</h1>
  <p class="lead">Open Recruitment Core Team periode 2026/2027. Masukkan data yang sama seperti saat mendaftar.</p>

  <form class="card" id="form" autocomplete="off">
    <div class="field"><label for="nama">Nama lengkap</label><input id="nama" placeholder="Sesuai yang diisi di formulir" autocapitalize="words" required></div>
    <div class="field"><label for="nim">NIM</label><input id="nim" inputmode="numeric" placeholder="Contoh: 24xxxxxxxxxx" required></div>
    <button class="go" id="btn" type="submit">Lihat hasil</button>
    <p class="hint">Hanya data kamu sendiri yang tampil. Data pelamar lain tidak bisa dilihat.</p>
  </form>
  <div id="out"></div>
  <p class="foot">GDGoC Maliki 2026/2027</p>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbz5u7Vm1Hx5ykRrwTDyjF4AbIQojwtFwLuI05gSHr1aiZX8Jb9JKhBqcFfXZJq36M-CLw/exec';
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function isNum(x) { return typeof x === 'number' && isFinite(x); }
function f(x) { return isNum(x) ? (Math.round(x * 100) / 100).toString().replace('.', ',') : (x === '' || x == null ? '–' : esc(x)); }
function pct(a, b) { return isNum(a) && b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0; }
function tone(p) { return p >= 80 ? 'var(--green)' : p >= 60 ? 'var(--blue)' : p >= 40 ? 'var(--yellow)' : 'var(--red)'; }
function maskNim(n) { n = String(n || ''); return n.length > 6 ? n.slice(0, 3) + '•••••' + n.slice(-3) : n; }

function pesan(ic, judul, isi, err) {
  $('out').innerHTML = '<div class="msg fade' + (err ? ' err' : '') + '"><span class="ic">' + ic + '</span><div><b>' + esc(judul) + '</b>' + esc(isi) + '</div></div>';
}

function blok(judul, ket, b) {
  if (!b) return '';
  var h = '<div class="sec-t">' + esc(judul) + ' &nbsp;<span style="color:var(--mute);font-weight:500">' + f(b.total) + ' / ' + f(b.maks) + '</span></div>' + (ket ? '<p class="sub">' + esc(ket) + '</p>' : '');
  b.kriteria.forEach(function (k) {
    var p = pct(k.skor, k.maks);
    h += '<div class="crit"><div class="row"><span>' + esc(k.nama) + '</span><span class="v">' + f(k.skor) + ' <small>/ ' + f(k.maks) + '</small></span></div>' +
         '<div class="meter"><i data-w="' + p + '" style="background:' + tone(p) + '"></i></div>' +
         (k.alasan ? '<div class="why">' + esc(k.alasan) + '</div>' : '') + '</div>';
  });
  if (b.catatan) h += '<div class="note"><b>Catatan penilai</b>' + esc(b.catatan) + '</div>';
  return h;
}

function tampil(r) {
  if (r.status === 'belum') return pesan('⏳', 'Pengumuman belum dibuka', 'Pantau pengumuman resmi GDGoC Maliki. Halaman ini terbuka otomatis saat hasil diumumkan.');
  if (r.status === 'tidak') return pesan('🔎', 'Data tidak ditemukan', 'Pastikan nama lengkap dan NIM sama persis seperti yang kamu isi di formulir pendaftaran.', true);
  if (r.status === 'proses') return pesan('🛠️', 'Hasil belum tersedia', 'Penilaian kamu belum selesai diproses. Coba cek lagi nanti.');

  var lulus = r.keputusan === 'lulus', d = r.diterima || {};
  var p1 = r.pilihan1 || {}, p2 = r.pilihan2;
  var h = '<div class="card ann fade"><div class="ann-head">Hasil seleksi Open Recruitment Core Team 2026/2027</div>' +
    '<dl class="bio"><dt>Nama</dt><dd>' + esc(r.nama) + '</dd><dt>NIM</dt><dd>' + esc(maskNim(r.nim)) + '</dd>' +
    '<dt>Pilihan 1</dt><dd>' + esc(p1.divisi) + (p1.subdivisi ? ' · ' + esc(p1.subdivisi) : '') + '</dd>' +
    (p2 ? '<dt>Pilihan 2</dt><dd>' + esc(p2.divisi) + (p2.subdivisi ? ' · ' + esc(p2.subdivisi) : '') + '</dd>' : '') + '</dl>';
  if (lulus) {
    h += '<div class="verdict ok"><div class="mark">✓</div><small>Selamat</small><h2>Anda dinyatakan LULUS</h2>' +
      '<p>Kamu diterima sebagai Core Team GDGoC UIN Maulana Malik Ibrahim Malang periode 2026/2027.</p>' +
      '<div class="place">' + esc(d.divisi) + (d.subdivisi ? ' · ' + esc(d.subdivisi) : '') + '</div>' +
      (d.posisi ? '<div><span class="tag">Posisi: ' + esc(d.posisi) + '</span></div>' : '') +
      (d.jalur === 'Pilihan 2' ? '<div><span class="tag">Diterima melalui Pilihan 2</span></div>' : '') + '</div>';
  } else {
    h += '<div class="verdict no"><div class="mark">✕</div><small>Mohon maaf</small><h2>Anda dinyatakan TIDAK LULUS</h2>' +
      '<p>Terima kasih sudah mengikuti seleksi dan meluangkan waktu. Kamu belum bisa bergabung periode ini, tetapi kesempatan untuk terus belajar dan berkarya bersama GDGoC Maliki tetap terbuka.</p></div>';
  }
  var ring = isNum(r.total);
  var C = 2 * Math.PI * 52, pc = pct(r.total, 100);
  h += '<div class="summary">' +
    (ring ? '<div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52" fill="none" stroke-width="11"/>' +
      '<circle class="p" id="arc" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" style="stroke:' + tone(pc) + '"/></svg>' +
      '<div class="c"><b>' + f(r.total) + '</b><span>dari 100</span></div></div>' : '') +
    '<div class="stats">' +
    '<div class="stat wide"><small>Peringkat di ' + esc(p1.divisi) + ' (Pilihan 1)</small>' +
      (isNum(r.peringkat) ? '<b>#' + f(r.peringkat) + '</b> <em>dari ' + f(r.dariBerapa) + ' pelamar</em>' : '<b>–</b>') + '</div>' +
    '<div class="stat"><small>Nilai umum</small><b>' + f(r.nilaiUmum) + '</b> <em>/ ' + f(r.umum ? r.umum.maks : 30) + '</em></div>' +
    '<div class="stat"><small>Nilai divisi</small><b>' + f(r.nilaiDivisi) + '</b> <em>/ ' + f(r.divisi1 ? r.divisi1.maks : 70) + '</em></div>' +
    (lulus && d.jalur === 'Pilihan 2' && isNum(r.skorPilihan2) ? '<div class="stat wide"><small>Total nilai di ' + esc(d.divisi) + ' (Pilihan 2)</small><b>' + f(r.skorPilihan2) + '</b> <em>dari 100</em></div>' : '') +
    '</div></div>';
  h += '<div class="final-note">Keputusan ini ditetapkan oleh panitia berdasarkan nilai seleksi dan kuota tiap divisi.</div></div>';

  var rinci = blok('Penilaian umum', 'Dinilai bersama oleh Ketua dan Wakil Ketua', r.umum) +
              blok('Penilaian ' + p1.divisi, 'Pilihan 1', r.divisi1) +
              (r.divisi2 && p2 ? blok('Penilaian ' + p2.divisi, 'Pilihan 2', r.divisi2) : '');
  if (rinci) h += '<details class="card fade"><summary>Rincian penilaian <span>nilai, alasan, catatan</span></summary><div class="det">' + rinci + '</div></details>';

  $('out').innerHTML = h;
  requestAnimationFrame(function () {
    setTimeout(function () {
      var a = $('arc'); if (a) a.style.strokeDashoffset = C * (1 - pc / 100);
      document.querySelectorAll('.meter i').forEach(function (m) { m.style.width = m.getAttribute('data-w') + '%'; });
    }, 60);
  });
  if (lulus) confetti();
  var v = document.querySelector('.ann'); if (v && v.scrollIntoView) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* confetti ringan, tanpa pustaka */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = $('confetti'), cx = cv.getContext('2d'), W, H;
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size();
  var cols = ['#4285f4', '#ea4335', '#fbbc04', '#34a853'], P = [], n = 140, t0 = Date.now();
  for (var i = 0; i < n; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, w: 6 + Math.random() * 7, h: 8 + Math.random() * 9, c: cols[i % 4], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -.2 + Math.random() * .4 });
  (function loop() {
    cx.clearRect(0, 0, W, H);
    P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if (Date.now() - t0 < 4200) requestAnimationFrame(loop); else cx.clearRect(0, 0, W, H);
  })();
}

/* data contoh untuk demo: ?demo=lulus | pilihan2 | tidak */
function demo(k) {
  var umum = { total: 25.5, maks: 30, catatan: 'Komunikasi bagus dan terlihat siap berkomitmen.', kriteria: [
    { nama: 'Motivasi dan alasan bergabung', skor: 4, maks: 4, alasan: 'Alasan jelas dan spesifik.' },
    { nama: 'Komunikasi', skor: 5, maks: 6, alasan: '' }, { nama: 'Komitmen dan waktu', skor: 4, maks: 5, alasan: '' },
    { nama: 'Kerja sama tim', skor: 5, maks: 6, alasan: '' }, { nama: 'Pengalaman organisasi', skor: 4.5, maks: 5, alasan: '' },
    { nama: 'Sikap dan etika', skor: 3, maks: 4, alasan: '' }] };
  var div = { total: 59, maks: 70, catatan: 'Portofolio rapi, perlu latihan di motion.', kriteria: [
    { nama: 'Kompetensi sesuai subdivisi', skor: 15, maks: 17, alasan: 'Layout dan tipografi kuat.' },
    { nama: 'Kualitas portofolio', skor: 13, maks: 14, alasan: '' }, { nama: 'Kreativitas ide', skor: 10, maks: 12, alasan: '' },
    { nama: 'Pemahaman brand', skor: 8, maks: 12, alasan: 'Belum paham panduan brand GDG.' },
    { nama: 'Konsistensi kerja', skor: 8, maks: 9, alasan: '' }, { nama: 'Wawasan tren', skor: 5, maks: 6, alasan: '' }] };
  var base = { status: 'ok', nama: 'Nama Contoh Pelamar', nim: '240601110000', umum: umum, divisi1: div, nilaiUmum: 25.5, nilaiDivisi: 59, total: 84.5, peringkat: 3, dariBerapa: 18 };
  if (k === 'tidak') {
    base.pilihan1 = { divisi: 'Creative Media', subdivisi: 'Videography' }; base.keputusan = 'tidak'; base.total = 71.25; base.nilaiDivisi = 45.75; base.peringkat = 11; base.diterima = null;
  } else if (k === 'pilihan2') {
    base.pilihan1 = { divisi: 'Event & Program', subdivisi: 'Internal Operations' }; base.pilihan2 = { divisi: 'General Officer', subdivisi: 'Secretary 2' };
    base.keputusan = 'lulus'; base.peringkat = 9; base.dariBerapa = 20; base.total = 76; base.skorPilihan2 = 81.5;
    base.diterima = { divisi: 'General Officer', subdivisi: 'Secretary 2', jalur: 'Pilihan 2', posisi: '' };
  } else {
    base.pilihan1 = { divisi: 'Creative Media', subdivisi: 'Graphic Design' }; base.keputusan = 'lulus';
    base.diterima = { divisi: 'Creative Media', subdivisi: 'Graphic Design', jalur: 'Pilihan 1', posisi: '' };
  }
  return base;
}

$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('btn'); btn.disabled = true; btn.textContent = 'Memeriksa data...';
  $('out').innerHTML = '<div class="card"><div class="sk" style="width:55%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>';
  var t0 = Date.now();
  var done = function (r) { setTimeout(function () { btn.disabled = false; btn.textContent = 'Lihat hasil'; tampil(r); }, Math.max(0, 900 - (Date.now() - t0))); };
  var fail = function () { btn.disabled = false; btn.textContent = 'Lihat hasil'; pesan('⚠️', 'Terjadi gangguan', 'Coba lagi sebentar lagi.', true); };
  fetch(API, { method: 'POST', body: JSON.stringify({ nama: $('nama').value, nim: $('nim').value }) })
    .then(function (x) { return x.json(); }).then(done, fail);
});

var m = location.search.match(/demo=(\w+)/);
if (m) { var k = m[1] === '1' ? 'lulus' : m[1]; tampil(demo(k)); }
</script>
</body>
</html>
