<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4285f4">
<title>Cek Hasil Open Recruitment GDGoC Maliki</title>
<style>
  :root {
    --bg: #f6f8fc; --card: #ffffff; --ink: #1f2430; --mute: #5f6877; --line: #e4e8f0;
    --blue: #4285f4; --red: #ea4335; --yellow: #fbbc04; --green: #34a853;
    --soft: #eef3fe; --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c25; --ink: #eceff5; --mute: #9aa3b5; --line: #272d3a; --soft: #1b2438; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { height: 5px; background: linear-gradient(90deg, var(--blue) 0 25%, var(--red) 25% 50%, var(--yellow) 50% 75%, var(--green) 75%); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--mute); font-size: 14px; letter-spacing: .02em; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 14px 0 6px; letter-spacing: -.02em; }
  .lead { color: var(--mute); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--mute); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input { width: 100%; padding: 13px 14px; font-size: 16px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(66,133,244,.18); }
  button.go { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: var(--blue); border: 0; border-radius: 12px; cursor: pointer; transition: transform .1s, filter .15s; }
  button.go:hover { filter: brightness(1.06); }
  button.go:active { transform: scale(.985); }
  button.go:disabled { background: #9aa3b5; cursor: wait; }
  .hint { font-size: 12.5px; color: var(--mute); margin: 10px 0 0; text-align: center; }
  .msg { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); }
  .msg.err { background: rgba(234,67,53,.08); border-color: rgba(234,67,53,.3); }
  .msg b { display: block; margin-bottom: 2px; }
  .msg .ic { font-size: 22px; line-height: 1.2; }

  .hero { position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: linear-gradient(90deg, var(--blue), var(--green)); }
  .name { font-size: 22px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.01em; }
  .nim { color: var(--mute); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chip { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
  .chip small { color: var(--mute); margin-right: 4px; }
  .summary { display: flex; align-items: center; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .t { stroke: var(--line); }
  .ring .p { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
  .ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .c b { font-size: 34px; line-height: 1; letter-spacing: -.02em; }
  .ring .c span { font-size: 12px; color: var(--mute); }
  .stats { flex: 1; min-width: 200px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .stat small { display: block; color: var(--mute); font-size: 12px; }
  .stat b { font-size: 22px; letter-spacing: -.01em; }
  .stat em { font-style: normal; color: var(--mute); font-size: 13px; }
  .stat.wide { grid-column: 1 / -1; }

  .sec h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 17px; margin: 0 0 4px; }
  .sec h2 span { font-size: 14px; color: var(--mute); font-weight: 500; white-space: nowrap; }
  .sec h2 span b { color: var(--ink); font-size: 18px; }
  .sub { font-size: 13px; color: var(--mute); margin: 0 0 14px; }
  .crit { padding: 12px 0; border-top: 1px solid var(--line); }
  .crit:first-of-type { border-top: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 500; }
  .row .v { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
  .row .v small { color: var(--mute); font-weight: 500; }
  .meter { height: 8px; border-radius: 99px; background: var(--line); margin: 8px 0 0; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--blue); transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .why { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--blue); background: var(--soft); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--mute); white-space: pre-line; }
  .note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(251,188,4,.12); border: 1px solid rgba(251,188,4,.4); font-size: 14px; white-space: pre-line; }
  .note b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin-bottom: 2px; }
  .foot { text-align: center; color: var(--mute); font-size: 12.5px; margin-top: 28px; }

  .sk { height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--line) 25%, var(--soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; margin: 10px 0; }
  @keyframes sh { to { background-position: -200% 0; } }
  .fade { animation: up .4s ease both; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <div class="brand"><span class="dots"><i style="background:#4285f4"></i><i style="background:#ea4335"></i><i style="background:#fbbc04"></i><i style="background:#34a853"></i></span>GDGoC UIN Maulana Malik Ibrahim Malang</div>
  <h1>Cek hasil Open Recruitment</h1>
  <p class="lead">Core Team periode 2026/2027. Masukkan data yang sama seperti saat mendaftar untuk melihat nilai dan catatan penilaian kamu.</p>

  <form class="card" id="form" autocomplete="off">
    <div class="field"><label for="nama">Nama lengkap</label><input id="nama" placeholder="Sesuai yang diisi di formulir" autocapitalize="words" required></div>
    <div class="field"><label for="nim">NIM</label><input id="nim" inputmode="numeric" placeholder="Contoh: 24xxxxxxxxxx" required></div>
    <button class="go" id="btn" type="submit">Lihat hasil</button>
    <p class="hint">Hanya data kamu sendiri yang tampil. Data pelamar lain tidak bisa dilihat.</p>
  </form>
  <div id="out"></div>
  <p class="foot">GDGoC Maliki 2026/2027</p>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbz5u7Vm1Hx5ykRrwTDyjF4AbIQojwtFwLuI05gSHr1aiZX8Jb9JKhBqcFfXZJq36M-CLw/exec';
var $ = function (id) { return document.getElementById(id); };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function f(x) { return (typeof x === 'number') ? (Math.round(x * 100) / 100).toString().replace('.', ',') : esc(x); }
function pct(a, b) { return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0; }
function tone(p) { return p >= 80 ? 'var(--green)' : p >= 60 ? 'var(--blue)' : p >= 40 ? 'var(--yellow)' : 'var(--red)'; }
function maskNim(n) { n = String(n || ''); return n.length > 6 ? n.slice(0, 3) + '•••••' + n.slice(-3) : n; }

function pesan(ic, judul, isi, err) {
  $('out').innerHTML = '<div class="msg fade' + (err ? ' err' : '') + '"><span class="ic">' + ic + '</span><div><b>' + esc(judul) + '</b>' + esc(isi) + '</div></div>';
}

function blok(judul, ket, b) {
  if (!b) return '';
  var h = '<div class="card sec fade"><h2>' + esc(judul) + '<span><b>' + f(b.total) + '</b> / ' + f(b.maks) + '</span></h2>' + (ket ? '<p class="sub">' + esc(ket) + '</p>' : '');
  b.kriteria.forEach(function (k) {
    var p = pct(k.skor, k.maks);
    h += '<div class="crit"><div class="row"><span>' + esc(k.nama) + '</span><span class="v">' + f(k.skor) + ' <small>/ ' + f(k.maks) + '</small></span></div>' +
         '<div class="meter"><i data-w="' + p + '" style="background:' + tone(p) + '"></i></div>' +
         (k.alasan ? '<div class="why">' + esc(k.alasan) + '</div>' : '') + '</div>';
  });
  if (b.catatan) h += '<div class="note"><b>Catatan penilai</b>' + esc(b.catatan) + '</div>';
  return h + '</div>';
}

function tampil(r) {
  if (r.status === 'belum') return pesan('⏳', 'Hasil belum dibuka', 'Pantau pengumuman resmi GDGoC Maliki. Halaman ini terbuka otomatis saat hasil diumumkan.');
  if (r.status === 'tidak') return pesan('🔎', 'Data tidak ditemukan', 'Pastikan nama lengkap dan NIM sama persis seperti yang kamu isi di formulir pendaftaran.', true);
  if (r.status === 'proses') return pesan('🛠️', 'Penilaian masih diproses', 'Nilai kamu belum lengkap. Coba cek lagi nanti.');
  var p = pct(r.total, 100), C = 2 * Math.PI * 56;
  var h = '<div class="card hero fade">' +
    '<div class="name">' + esc(r.nama) + '</div><div class="nim">NIM ' + esc(maskNim(r.nim)) + '</div>' +
    '<div class="chips"><span class="chip"><small>Pilihan 1</small>' + esc(r.pilihan1.divisi) + (r.pilihan1.subdivisi ? ' · ' + esc(r.pilihan1.subdivisi) : '') + '</span>' +
    (r.pilihan2 ? '<span class="chip"><small>Pilihan 2</small>' + esc(r.pilihan2.divisi) + (r.pilihan2.subdivisi ? ' · ' + esc(r.pilihan2.subdivisi) : '') + '</span>' : '') + '</div>' +
    '<div class="summary"><div class="ring"><svg viewBox="0 0 132 132"><circle class="t" cx="66" cy="66" r="56" fill="none" stroke-width="12"/>' +
    '<circle class="p" id="arc" cx="66" cy="66" r="56" fill="none" stroke-width="12" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" style="stroke:' + tone(p) + '"/></svg>' +
    '<div class="c"><b>' + f(r.total) + '</b><span>dari 100</span></div></div>' +
    '<div class="stats"><div class="stat wide"><small>Peringkat di ' + esc(r.pilihan1.divisi) + '</small><b>#' + f(r.peringkat) + '</b> <em>dari ' + f(r.dariBerapa) + ' pelamar</em></div>' +
    '<div class="stat"><small>Nilai umum</small><b>' + f(r.nilaiUmum) + '</b> <em>/ ' + f(r.umum ? r.umum.maks : 30) + '</em></div>' +
    '<div class="stat"><small>Nilai divisi</small><b>' + f(r.nilaiDivisi) + '</b> <em>/ ' + f(r.divisi1 ? r.divisi1.maks : 70) + '</em></div></div></div></div>';
  h += blok('Penilaian umum', 'Dinilai bersama oleh Ketua dan Wakil Ketua', r.umum);
  h += blok('Penilaian ' + r.pilihan1.divisi, 'Pilihan 1', r.divisi1);
  if (r.divisi2) h += blok('Penilaian ' + r.pilihan2.divisi, 'Pilihan 2', r.divisi2);
  $('out').innerHTML = h;
  requestAnimationFrame(function () {
    setTimeout(function () {
      var a = $('arc'); if (a) a.style.strokeDashoffset = C * (1 - p / 100);
      document.querySelectorAll('.meter i').forEach(function (m) { m.style.width = m.getAttribute('data-w') + '%'; });
    }, 60);
  });
}

function demo() {
  return {
    status: 'ok', nama: 'Nama Contoh Pelamar', nim: '240601110000',
    pilihan1: { divisi: 'Creative Media', subdivisi: 'Graphic Design' }, pilihan2: { divisi: 'Event & Program', subdivisi: '' },
    total: 84.5, peringkat: 3, dariBerapa: 18, nilaiUmum: 25.5, nilaiDivisi: 59,
    umum: { total: 25.5, maks: 30, catatan: 'Komunikasi bagus dan terlihat siap berkomitmen.', kriteria: [
      { nama: 'Motivasi dan alasan bergabung', skor: 4, maks: 4, alasan: 'Alasan jelas dan spesifik.' },
      { nama: 'Komunikasi', skor: 5, maks: 6, alasan: '' },
      { nama: 'Komitmen dan waktu', skor: 4, maks: 5, alasan: 'Jadwal kuliah masih bentrok di hari Kamis.' },
      { nama: 'Kerja sama tim', skor: 5, maks: 6, alasan: '' },
      { nama: 'Pengalaman organisasi', skor: 4.5, maks: 5, alasan: '' },
      { nama: 'Sikap dan etika', skor: 3, maks: 4, alasan: '' }] },
    divisi1: { total: 59, maks: 70, catatan: 'Portofolio rapi, perlu latihan di motion.', kriteria: [
      { nama: 'Kompetensi sesuai subdivisi', skor: 15, maks: 17, alasan: 'Layout dan tipografi kuat.' },
      { nama: 'Kualitas portofolio', skor: 13, maks: 14, alasan: '' },
      { nama: 'Kreativitas ide', skor: 10, maks: 12, alasan: '' },
      { nama: 'Pemahaman brand', skor: 8, maks: 12, alasan: 'Belum paham panduan brand GDG.' },
      { nama: 'Konsistensi kerja', skor: 8, maks: 9, alasan: '' },
      { nama: 'Wawasan tren', skor: 5, maks: 6, alasan: '' }] },
    divisi2: null
  };
}

$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('btn'); btn.disabled = true; btn.textContent = 'Mencari...';
  $('out').innerHTML = '<div class="card"><div class="sk" style="width:55%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>';
  var done = function (r) { btn.disabled = false; btn.textContent = 'Lihat hasil'; tampil(r); };
  var fail = function () { btn.disabled = false; btn.textContent = 'Lihat hasil'; pesan('⚠️', 'Terjadi gangguan', 'Coba lagi sebentar lagi.', true); };
  fetch(API, { method: 'POST', body: JSON.stringify({ nama: $('nama').value, nim: $('nim').value }) })
    .then(function (x) { return x.json(); }).then(done, fail);
});

if (location.search.indexOf('demo=1') >= 0) { tampil(demo()); }
</script>
</body>
</html>
